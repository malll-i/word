<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Collaborative Workspace - Naskah Teater</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    /* Liquid Glassmorphism & Smooth Animation Theme */
    body {
      background: radial-gradient(circle at top left, #e0e7ff, #f8fafc, #f1f5f9);
      background-attachment: fixed;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
    }

    /* Page Switch Smooth Animations */
    .page-transition {
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .page-enter {
      opacity: 0;
      transform: translateY(8px) scale(0.99);
    }

    .page-enter-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #94a3b8;
      pointer-events: none;
      display: block;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.6);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- TOP NAVBAR -->
  <header class="liquid-glass px-4 sm:px-8 py-3 flex items-center justify-between z-40 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-slate-900 rounded-xl text-white shadow-md">
        <i data-lucide="file-text" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <div>
        <h1 id="header-title" class="font-extrabold text-slate-900 text-sm sm:text-base tracking-tight leading-tight">Naskah Teater</h1>
        <div class="flex items-center text-[10px] sm:text-xs mt-0.5">
          <span id="sync-status" class="font-semibold text-slate-900 tracking-wide">
            Live Sync
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-2.5">
      <!-- Status Badge -->
      <div id="mode-badge" class="px-3 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-200/70 text-slate-700 border border-slate-300/60 backdrop-blur-md flex items-center">
        <i data-lucide="eye" class="w-3 h-3 mr-1.5"></i>
        <span class="hidden sm:inline">Mode </span>Lihat
      </div>

      <!-- Auth Button -->
      <button id="btn-auth" type="button" onclick="handleAuthButtonClick()" class="flex items-center px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 shadow-md hover:shadow-lg active:scale-95">
        <i data-lucide="lock" class="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1.5"></i>
        <span id="btn-auth-text">Edit</span>
      </button>
    </div>
  </header>

  <!-- WORKSPACE TOOLBAR -->
  <div class="liquid-glass border-t-0 px-3 sm:px-6 py-2 flex items-center justify-between overflow-x-auto text-slate-700 z-30 shrink-0">
    
    <!-- Toolbar Naskah -->
    <div id="editor-toolbar" class="flex items-center space-x-1 text-slate-400 pointer-events-none opacity-40 transition-all duration-300 shrink-0">
      <button type="button" onclick="execCmd('undo')" title="Undo" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('redo')" title="Redo" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>

      <div class="h-4 w-px bg-slate-300/60 mx-1.5 shrink-0"></div>

      <!-- Ukuran Teks -->
      <select onchange="execCmd('fontSize', this.value)" class="text-xs border border-slate-300/70 rounded-lg px-2 py-1 text-slate-700 outline-none bg-white/80 backdrop-blur-sm cursor-pointer shrink-0 shadow-sm">
        <option value="2">Kecil</option>
        <option value="3" selected>Normal</option>
        <option value="4">Sedang</option>
        <option value="5">Besar</option>
        <option value="6">Sangat Besar</option>
      </select>

      <div class="h-4 w-px bg-slate-300/60 mx-1.5 shrink-0"></div>

      <!-- Format Teks -->
      <button type="button" onclick="execCmd('bold')" title="Tebal" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="bold" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('italic')" title="Miring" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="italic" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('underline')" title="Garis Bawah" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="underline" class="w-4 h-4"></i>
      </button>

      <div class="h-4 w-px bg-slate-300/60 mx-1.5 shrink-0"></div>

      <!-- Alignment Teks -->
      <button type="button" onclick="execCmd('justifyLeft')" title="Rata Kiri" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="align-left" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('justifyCenter')" title="Rata Tengah" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="align-center" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('justifyRight')" title="Rata Kanan" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="align-right" class="w-4 h-4"></i>
      </button>

      <div class="h-4 w-px bg-slate-300/60 mx-1.5 shrink-0"></div>

      <!-- List & Gambar -->
      <button type="button" onclick="execCmd('insertUnorderedList')" title="Bullet List" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="list" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="execCmd('insertOrderedList')" title="Numbered List" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 transition shrink-0">
        <i data-lucide="list-ordered" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="triggerImageUpload()" class="p-1.5 hover:bg-slate-200/60 rounded-lg text-slate-700 flex items-center space-x-1.5 text-xs font-semibold transition shrink-0">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span>Gambar</span>
      </button>
      <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
    </div>

    <!-- Navigasi Halaman -->
    <div class="flex items-center space-x-1.5 ml-auto shrink-0 pl-2">
      <button id="tab-naskah" type="button" onclick="switchPage('naskah')" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-900 text-white shadow-sm flex items-center transition-all duration-300">
        <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1.5"></i> Naskah
      </button>
      <button id="tab-keuangan" type="button" onclick="switchPage('keuangan')" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-200/60 flex items-center transition-all duration-300">
        <i data-lucide="wallet" class="w-3.5 h-3.5 mr-1.5"></i> Daftar Keuangan
      </button>
    </div>
  </div>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="word-viewport" class="flex-1 overflow-y-auto px-3 sm:px-6 py-8 flex flex-col items-center">
    
    <!-- HALAMAN 1: NASKAH TEATER -->
    <div id="page-naskah" class="liquid-glass-card rounded-2xl p-6 sm:p-14 w-full max-w-[850px] mb-12 flex flex-col page-transition page-enter-active">
      <div id="doc-title" contenteditable="false" placeholder="Judul Dokumen..." class="text-2xl sm:text-3xl font-black text-slate-900 outline-none mb-6 border-b border-transparent focus:border-slate-300/80 pb-2 shrink-0 tracking-tight">
        Naskah Teater
      </div>
      <div id="doc-editor" contenteditable="false" placeholder="Mulai mengetik di sini..." class="text-slate-800 text-sm sm:text-base leading-relaxed outline-none flex-1 min-h-[50vh]">
      </div>
    </div>

    <!-- HALAMAN 2: DAFTAR KEUANGAN -->
    <div id="page-keuangan" class="liquid-glass-card rounded-2xl p-6 sm:p-10 w-full max-w-[850px] mb-12 flex-col hidden page-transition page-enter">
      <div class="border-b border-slate-200/80 pb-4 mb-6">
        <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Daftar Keuangan Teater</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Pencatatan udunan anggota & data pemasukan/pengeluaran kas.</p>
      </div>

      <!-- BAGIAN 1: CEKLIS UDUNAN ANGGOTA (1-32) -->
      <section class="mb-8">
        <h3 class="text-sm sm:text-base font-bold text-slate-800 mb-3 flex items-center tracking-tight">
          <i data-lucide="users" class="w-4 h-4 mr-2 text-slate-900"></i> Check List Udunan Anggota (1 - 32)
        </h3>
        <div class="bg-white/50 border border-slate-200/80 rounded-xl p-3 sm:p-4 max-h-[360px] overflow-y-auto shadow-inner">
          <div id="udunan-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <!-- 32 Item Nama Sesuai Abjad -->
          </div>
        </div>
      </section>

      <!-- BAGIAN 2: FORM CATATAN KEUANGAN -->
      <section class="mb-8 bg-slate-900/5 border border-slate-900/10 rounded-2xl p-4 sm:p-6 backdrop-blur-md">
        <h3 class="text-sm sm:text-base font-bold text-slate-900 mb-3 flex items-center tracking-tight">
          <i data-lucide="plus-circle" class="w-4 h-4 mr-2 text-slate-900"></i> Tambah Catatan Keuangan
        </h3>
        <form id="finance-form" onsubmit="handleSaveFinance(event)" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Catatan Keterangan</label>
            <input type="text" id="fin-note" placeholder="Misal: Beli Konsumsi Properti, Udunan Kas, dll" required class="w-full px-3.5 py-2.5 text-xs sm:text-sm border border-slate-300/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white/90">
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Jenis Kas</label>
              <select id="fin-type" class="w-full px-3.5 py-2.5 text-xs sm:text-sm border border-slate-300/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white/90 cursor-pointer">
                <option value="in">Uang Masuk (+)</option>
                <option value="out">Uang Keluar (-)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nominal (Rp)</label>
              <input type="number" id="fin-amount" placeholder="0" min="0" required class="w-full px-3.5 py-2.5 text-xs sm:text-sm border border-slate-300/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white/90">
            </div>
          </div>

          <button id="btn-save-finance" type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 shadow-md active:scale-95 flex items-center justify-center">
            <i data-lucide="save" class="w-4 h-4 mr-1.5"></i> Simpan Catatan
          </button>
        </form>
      </section>

      <!-- BAGIAN 3: RINGKASAN & RIWAYAT KEUANGAN -->
      <section>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm sm:text-base font-bold text-slate-800 flex items-center tracking-tight">
            <i data-lucide="history" class="w-4 h-4 mr-2 text-slate-900"></i> Riwayat Transaksi
          </h3>
          <div class="text-xs font-bold text-slate-700">
            Total Saldo: <span id="fin-total-balance" class="text-slate-900 font-extrabold">Rp 0</span>
          </div>
        </div>

        <div class="bg-white/80 border border-slate-200/80 rounded-xl overflow-hidden shadow-sm backdrop-blur-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr class="bg-slate-100/80 text-slate-700 font-bold border-b border-slate-200/80">
                  <th class="p-3">Keterangan</th>
                  <th class="p-3">Jenis</th>
                  <th class="p-3 text-right">Nominal</th>
                  <th class="p-3 text-center w-12">Aksi</th>
                </tr>
              </thead>
              <tbody id="finance-history-list" class="divide-y divide-slate-100">
                <!-- Riwayat Transaksi -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

  </main>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden transition-all duration-300">
    <div class="liquid-glass-card rounded-2xl p-6 w-full max-w-xs transform transition-all scale-95 opacity-0" id="auth-modal-card">
      <div class="text-center mb-5">
        <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h3 id="modal-title" class="text-base font-black text-slate-900 tracking-tight">Akses Edit</h3>
      </div>

      <div class="space-y-4">
        <div>
          <input type="password" id="passcode-input" maxlength="10" placeholder="••••" class="w-full px-3 py-2.5 text-center text-xl tracking-widest font-mono border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white/90">
          <p id="auth-error" class="text-xs text-rose-500 font-semibold text-center mt-1.5 hidden">Kode salah!</p>
        </div>

        <div class="flex space-x-2">
          <button type="button" onclick="closeAuthModal()" class="w-1/2 py-2.5 border border-slate-300/80 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 transition">
            Batal
          </button>
          <button type="button" onclick="verifyPasscodeDirectly()" class="w-1/2 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition shadow-md active:scale-95">
            Masuk
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    lucide.createIcons();

    const firebaseConfig = {
      apiKey: "AIzaSyCanbPKgL9lWVcahv543bnFKrigKUunFze",
      authDomain: "word-b7629.firebaseapp.com",
      databaseURL: "https://word-b7629-default-rtdb.firebaseio.com",
      projectId: "word-b7629",
      storageBucket: "word-b7629.firebasestorage.app",
      messagingSenderId: "692080385601",
      appId: "1:692080385601:web:34c51e44c937382cc870c0"
    };

    let dbRefDoc = null;
    let dbRefFinance = null;

    try {
      firebase.initializeApp(firebaseConfig);
      dbRefDoc = firebase.database().ref('shared_document_1111');
      dbRefFinance = firebase.database().ref('shared_finance_0000');
    } catch (e) {
      console.error("Firebase Init Error:", e);
    }

    const CODE_NASKAH = "9999";
    const CODE_KEUANGAN = "0000";

    let activePage = "naskah";
    let isEditModeNaskah = false;
    let isEditModeKeuangan = false;
    let isLocalUpdatingDoc = false;
    let isLocalUpdatingFinance = false;

    const docTitle = document.getElementById('doc-title');
    const docEditor = document.getElementById('doc-editor');
    const modeBadge = document.getElementById('mode-badge');
    const btnAuthText = document.getElementById('btn-auth-text');
    const editorToolbar = document.getElementById('editor-toolbar');
    const authModal = document.getElementById('auth-modal');
    const authModalCard = document.getElementById('auth-modal-card');
    const passInput = document.getElementById('passcode-input');
    const authError = document.getElementById('auth-error');

    const fixedNames = [
      "Apif Patoni",
      "Akmal Nurjaman",
      "Aliya Afifah",
      "Azkiya Nur'Azizah",
      "Chelsy Nur Maghfira",
      "Citra Azqia Putri",
      "Diaz Putri Qirenia",
      "Dinda Aprillia Dwi Fauziah",
      "Evan Tri Ramos",
      "Fanny Maulani Fadhilah",
      "Ginna Oktaviani",
      "Indra Cahyadisepta",
      "Intan Silvani Aulia",
      "Kinnaya Siti Aqilasyah",
      "Malona Putri Hutapea",
      "Mikail Aqiela Nabhan",
      "Moch Fardhan Ardiansyah",
      "Muhammad Deva Ramdani",
      "Muhammad Randy Maulana",
      "Muhammad Rifansyah",
      "Nadya Nur Hafifah",
      "Raden Muhammad Bryenth Allinsky",
      "Raishalia Shafa Sugiharto",
      "Rayhan Saeful Kanzaki Arsa",
      "Reggy Rachmattilah",
      "Rianty Aulia Puteri",
      "Riza Achmad Fauzan",
      "Tenty Yulia",
      "Tsuraya Luthfika Raudhotul Jannah",
      "Ulfah Syabaniah",
      "Wirya Fakih Agustian",
      "Zibril Anugrah Alifansyah"
    ];

    const udunanListEl = document.getElementById('udunan-list');
    let udunanData = {};

    function initUdunanGrid() {
      udunanListEl.innerHTML = '';
      fixedNames.forEach((fullName, idx) => {
        const i = idx + 1;
        const itemKey = `person_${i}`;
        const itemData = udunanData[itemKey] || { checked: false };
        
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-2.5 bg-white/90 rounded-xl border border-slate-200/80 text-xs shadow-sm hover:border-slate-300 transition";
        div.innerHTML = `
          <div class="flex items-center space-x-2 flex-1 mr-2 overflow-hidden">
            <span class="font-extrabold text-slate-400 w-5 shrink-0">${i}.</span>
            <span class="font-semibold text-slate-800 truncate flex-1">${fullName}</span>
          </div>
          <label class="flex items-center space-x-1.5 shrink-0 cursor-pointer ${!isEditModeKeuangan ? 'pointer-events-none opacity-70' : ''}">
            <span class="text-[11px] font-bold text-slate-600">Udunan</span>
            <input type="checkbox" id="udunan-check-${i}" ${itemData.checked ? 'checked' : ''} ${!isEditModeKeuangan ? 'disabled' : ''} onchange="handleUdunanCheckChange(${i}, this.checked)" class="w-4 h-4 text-slate-900 rounded-md border-slate-300 focus:ring-slate-900 cursor-pointer">
          </label>
        `;
        udunanListEl.appendChild(div);
      });
    }

    if (dbRefDoc) {
      dbRefDoc.once('value').then((snapshot) => {
        if (!snapshot.exists()) {
          dbRefDoc.set({ title: "Naskah Teater", content: "", updatedAt: Date.now() });
        }
      });

      dbRefDoc.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && !isLocalUpdatingDoc) {
          if (data.title !== undefined && docTitle.innerText !== data.title) {
            docTitle.innerText = data.title;
          }
          if (data.content !== undefined && docEditor.innerHTML !== data.content) {
            docEditor.innerHTML = data.content;
          }
        }
      });
    }

    let financeItems = [];
    if (dbRefFinance) {
      dbRefFinance.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        udunanData = data.udunan || {};
        financeItems = data.items || [];
        
        if (!isLocalUpdatingFinance) {
          initUdunanGrid();
        }
        renderFinanceHistory();
      });
    }

    function saveDocToCloud(title, content) {
      if (!isEditModeNaskah || !dbRefDoc) return;
      dbRefDoc.set({ title: title, content: content, updatedAt: Date.now() });
    }

    function saveFinanceToCloud() {
      if (!isEditModeKeuangan || !dbRefFinance) return;
      isLocalUpdatingFinance = true;
      dbRefFinance.set({
        udunan: udunanData,
        items: financeItems,
        updatedAt: Date.now()
      }).then(() => {
        setTimeout(() => { isLocalUpdatingFinance = false; }, 300);
      });
    }

    function setupEditorListeners() {
      const handleInput = () => {
        if (!isEditModeNaskah) return;
        isLocalUpdatingDoc = true;
        saveDocToCloud(docTitle.innerText, docEditor.innerHTML);
        setTimeout(() => { isLocalUpdatingDoc = false; }, 200);
      };
      docTitle.addEventListener('input', handleInput);
      docEditor.addEventListener('input', handleInput);
    }
    setupEditorListeners();

    function handleUdunanCheckChange(index, isChecked) {
      if (!isEditModeKeuangan) return;
      const key = `person_${index}`;
      if (!udunanData[key]) udunanData[key] = {};
      udunanData[key].checked = isChecked;
      saveFinanceToCloud();
    }

    function handleSaveFinance(e) {
      e.preventDefault();
      if (!isEditModeKeuangan) return;

      const note = document.getElementById('fin-note').value.trim();
      const type = document.getElementById('fin-type').value;
      const amount = parseFloat(document.getElementById('fin-amount').value) || 0;

      if (!note || amount <= 0) return;

      financeItems.unshift({
        id: Date.now(),
        note: note,
        type: type,
        amount: amount
      });

      document.getElementById('fin-note').value = '';
      document.getElementById('fin-amount').value = '';

      saveFinanceToCloud();
      renderFinanceHistory();
    }

    function deleteFinanceItem(id) {
      if (!isEditModeKeuangan) return;
      financeItems = financeItems.filter(item => item.id !== id);
      saveFinanceToCloud();
      renderFinanceHistory();
    }

    function renderFinanceHistory() {
      const historyEl = document.getElementById('finance-history-list');
      const totalBalanceEl = document.getElementById('fin-total-balance');
      
      historyEl.innerHTML = '';
      let totalBalance = 0;

      if (financeItems.length === 0) {
        historyEl.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400 italic">Belum ada catatan transaksi.</td></tr>`;
      } else {
        financeItems.forEach((item) => {
          if (item.type === 'in') totalBalance += item.amount;
          else totalBalance -= item.amount;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/80 transition";
          tr.innerHTML = `
            <td class="p-3 font-semibold text-slate-800">${item.note}</td>
            <td class="p-3">
              <span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold tracking-wide ${item.type === 'in' ? 'bg-slate-900 text-white' : 'bg-rose-100 text-rose-700'}">
                ${item.type === 'in' ? 'MASUK (+)' : 'KELUAR (-)'}
              </span>
            </td>
            <td class="p-3 text-right font-bold ${item.type === 'in' ? 'text-slate-900' : 'text-rose-600'}">
              Rp ${item.amount.toLocaleString('id-ID')}
            </td>
            <td class="p-3 text-center">
              ${isEditModeKeuangan ? `<button type="button" onclick="deleteFinanceItem(${item.id})" class="text-rose-500 hover:text-rose-700 p-1 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : `<span class="text-slate-300">-</span>`}
            </td>
          `;
          historyEl.appendChild(tr);
        });
      }

      totalBalanceEl.innerText = `Rp ${totalBalance.toLocaleString('id-ID')}`;
      lucide.createIcons();
    }

    // SMOOTH PAGE SWITCHING
    function switchPage(page) {
      if (activePage === page) return;
      
      const tabNaskah = document.getElementById('tab-naskah');
      const tabKeuangan = document.getElementById('tab-keuangan');
      const pageNaskah = document.getElementById('page-naskah');
      const pageKeuangan = document.getElementById('page-keuangan');
      const headerTitle = document.getElementById('header-title');

      const currentPageEl = activePage === 'naskah' ? pageNaskah : pageKeuangan;
      const targetPageEl = page === 'naskah' ? pageNaskah : pageKeuangan;

      currentPageEl.classList.remove('page-enter-active');
      currentPageEl.classList.add('page-enter');

      setTimeout(() => {
        currentPageEl.classList.add('hidden');
        currentPageEl.classList.remove('flex');

        activePage = page;

        if (page === 'naskah') {
          headerTitle.innerText = "Naskah Teater";
          tabNaskah.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-900 text-white shadow-sm flex items-center transition-all duration-300";
          tabKeuangan.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-200/60 flex items-center transition-all duration-300";
          editorToolbar.classList.remove('hidden');
          updateUIState(isEditModeNaskah);
        } else {
          headerTitle.innerText = "Daftar Keuangan";
          tabKeuangan.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-900 text-white shadow-sm flex items-center transition-all duration-300";
          tabNaskah.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-200/60 flex items-center transition-all duration-300";
          editorToolbar.classList.add('hidden');
          updateUIState(isEditModeKeuangan);
        }

        targetPageEl.classList.remove('hidden');
        targetPageEl.classList.add('flex');

        setTimeout(() => {
          targetPageEl.classList.remove('page-enter');
          targetPageEl.classList.add('page-enter-active');
        }, 50);

      }, 200);
    }

    // SWIPE GESTURE DETECTOR UNTUK HP
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const viewportEl = document.getElementById('word-viewport');

    viewportEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    viewportEl.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipeGesture();
    }, { passive: true });

    function handleSwipeGesture() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // Abaikan jika gerakan lebih banyak vertikal (scroll halaman biasa)
      if (Math.abs(diffY) > Math.abs(diffX)) return;

      // Ambang batas geseran minimal 60px
      if (Math.abs(diffX) > 60) {
        // Geser ke Kiri (Next: Naskah -> Keuangan)
        if (diffX < 0 && activePage === 'naskah') {
          switchPage('keuangan');
        }
        // Geser ke Kanan (Prev: Keuangan -> Naskah)
        else if (diffX > 0 && activePage === 'keuangan') {
          switchPage('naskah');
        }
      }
    }

    function handleAuthButtonClick() {
      const currentEditState = activePage === 'naskah' ? isEditModeNaskah : isEditModeKeuangan;
      if (currentEditState) {
        setEditMode(false);
      } else {
        openAuthModal();
      }
    }

    function openAuthModal() {
      authModal.classList.remove('hidden');
      setTimeout(() => {
        authModalCard.classList.remove('scale-95', 'opacity-0');
        authModalCard.classList.add('scale-100', 'opacity-100');
      }, 10);

      passInput.value = '';
      authError.classList.add('hidden');
      
      const modalTitle = document.getElementById('modal-title');
      if (activePage === 'naskah') {
        modalTitle.innerText = "Akses Edit Naskah";
      } else {
        modalTitle.innerText = "Akses Edit Keuangan";
      }

      setTimeout(() => passInput.focus(), 150);
    }

    function closeAuthModal() {
      authModalCard.classList.remove('scale-100', 'opacity-100');
      authModalCard.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        authModal.classList.add('hidden');
      }, 200);
    }

    function verifyPasscodeDirectly() {
      const enteredPass = passInput.value.trim();
      const targetCode = activePage === 'naskah' ? CODE_NASKAH : CODE_KEUANGAN;

      if (enteredPass === targetCode) {
        closeAuthModal();
        setEditMode(true);
      } else {
        authError.classList.remove('hidden');
      }
    }

    passInput.addEventListener('keyup', function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        verifyPasscodeDirectly();
      }
    });

    function setEditMode(enabled) {
      if (activePage === 'naskah') {
        isEditModeNaskah = enabled;
        docTitle.setAttribute('contenteditable', enabled ? 'true' : 'false');
        docEditor.setAttribute('contenteditable', enabled ? 'true' : 'false');
        if (enabled) editorToolbar.classList.remove('pointer-events-none', 'opacity-40');
        else editorToolbar.classList.add('pointer-events-none', 'opacity-40');
      } else {
        isEditModeKeuangan = enabled;
        initUdunanGrid();
        renderFinanceHistory();
        const btnSaveFin = document.getElementById('btn-save-finance');
        if (enabled) btnSaveFin.classList.remove('pointer-events-none', 'opacity-40');
        else btnSaveFin.classList.add('pointer-events-none', 'opacity-40');
      }

      updateUIState(enabled);
    }

    function updateUIState(enabled) {
      if (enabled) {
        modeBadge.className = "px-3 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-500/10 text-emerald-700 border border-emerald-500/30 backdrop-blur-md flex items-center";
        modeBadge.innerHTML = `<i data-lucide="edit-3" class="w-3 h-3 mr-1.5"></i> Mode Edit`;
        btnAuthText.innerText = "Kunci";
      } else {
        modeBadge.className = "px-3 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-slate-200/70 text-slate-700 border border-slate-300/60 backdrop-blur-md flex items-center";
        modeBadge.innerHTML = `<i data-lucide="eye" class="w-3 h-3 mr-1.5"></i> <span class="hidden sm:inline">Mode </span>Lihat`;
        btnAuthText.innerText = "Edit";
      }
      lucide.createIcons();
    }

    function execCmd(command, value = null) {
      if (!isEditModeNaskah || activePage !== 'naskah') return;
      document.execCommand(command, false, value);
      docEditor.focus();
      saveDocToCloud(docTitle.innerText, docEditor.innerHTML);
    }

    function triggerImageUpload() {
      if (!isEditModeNaskah || activePage !== 'naskah') return;
      document.getElementById('image-input').click();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const imgHtml = `<div class="my-4"><img src="${event.target.result}" class="max-w-full h-auto rounded-xl shadow-md border border-slate-200 my-1 inline-block" alt="Gambar" /></div><p><br></p>`;
        execCmd('insertHTML', imgHtml);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    initUdunanGrid();
    renderFinanceHistory();
    document.getElementById('btn-save-finance').classList.add('pointer-events-none', 'opacity-40');
  </script>
</body>
</html>
