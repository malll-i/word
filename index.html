<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Collaborative Workspace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    .infinite-grid {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.6) 1px, transparent 1px);
    }
    
    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-2.5 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="p-1.5 bg-indigo-600 rounded-lg text-white">
        <i data-lucide="file-text" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-slate-900 text-sm sm:text-base leading-tight">Live Workspace</h1>
        <div class="flex items-center text-[10px] sm:text-xs">
          <span id="sync-status" class="flex items-center text-amber-600 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1 animate-pulse"></span>
            Menghubungkan...
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Status Badge -->
      <div id="mode-badge" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200 flex items-center">
        <i data-lucide="eye" class="w-3 h-3 mr-1"></i>
        <span class="hidden sm:inline">Mode </span>Lihat
      </div>

      <!-- Auth Button -->
      <button id="btn-auth" type="button" onclick="handleAuthButtonClick()" class="flex items-center px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs sm:text-sm font-medium transition duration-200 shadow-sm">
        <i data-lucide="lock" class="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1 sm:mr-1.5"></i>
        <span id="btn-auth-text">Kode Edit</span>
      </button>
    </div>
  </header>

  <!-- WORKSPACE TOOLBAR -->
  <div id="editor-toolbar" class="bg-white border-b border-slate-200 px-3 py-1.5 flex items-center overflow-x-auto space-x-1 text-slate-400 pointer-events-none opacity-50 transition-all z-20 shrink-0">
    <button type="button" onclick="execCmd('bold')" title="Tebal" class="p-2 hover:bg-slate-100 rounded text-slate-700 shrink-0">
      <i data-lucide="bold" class="w-4 h-4"></i>
    </button>
    <button type="button" onclick="execCmd('italic')" title="Miring" class="p-2 hover:bg-slate-100 rounded text-slate-700 shrink-0">
      <i data-lucide="italic" class="w-4 h-4"></i>
    </button>
    <button type="button" onclick="execCmd('underline')" title="Garis Bawah" class="p-2 hover:bg-slate-100 rounded text-slate-700 shrink-0">
      <i data-lucide="underline" class="w-4 h-4"></i>
    </button>
    <div class="h-4 w-px bg-slate-200 mx-1 shrink-0"></div>
    <button type="button" onclick="execCmd('insertUnorderedList')" title="Bullet List" class="p-2 hover:bg-slate-100 rounded text-slate-700 shrink-0">
      <i data-lucide="list" class="w-4 h-4"></i>
    </button>
    <button type="button" onclick="execCmd('insertOrderedList')" title="Numbered List" class="p-2 hover:bg-slate-100 rounded text-slate-700 shrink-0">
      <i data-lucide="list-ordered" class="w-4 h-4"></i>
    </button>
    <div class="h-4 w-px bg-slate-200 mx-1 shrink-0"></div>
    <button type="button" onclick="triggerImageUpload()" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 flex items-center space-x-1 text-xs font-medium shrink-0">
      <i data-lucide="image" class="w-4 h-4"></i>
      <span>Gambar</span>
    </button>
    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
  </div>

  <!-- MAIN CANVAS CONTAINER -->
  <main id="canvas-viewport" class="flex-1 relative overflow-hidden infinite-grid cursor-grab active:cursor-grabbing touch-none">
    <div id="canvas-transform" class="absolute inset-0 origin-top-left" style="transform: translate(0px, 0px) scale(1);">
      <div id="doc-card" class="absolute bg-white rounded-xl border border-slate-200 p-5 sm:p-10 shadow-sm w-[92vw] max-w-[800px] min-h-[75vh] left-1/2 top-4 -translate-x-1/2 transition-shadow duration-300">
        <div id="doc-title" contenteditable="false" placeholder="Judul Dokumen..." class="text-xl sm:text-3xl font-extrabold text-slate-900 outline-none mb-4 border-b border-transparent focus:border-slate-200 pb-2">
          Dokumen Bersama
        </div>
        <div id="doc-editor" contenteditable="false" placeholder="Mulai mengetik di sini..." class="text-slate-700 text-sm sm:text-base leading-relaxed outline-none min-h-[50vh]">
        </div>
      </div>
    </div>

    <!-- Zoom Controls -->
    <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur border border-slate-200 rounded-lg shadow-lg flex items-center space-x-1 p-1 z-20">
      <button type="button" onclick="zoomOut()" class="p-2 hover:bg-slate-100 rounded text-slate-600"><i data-lucide="minus" class="w-4 h-4"></i></button>
      <span id="zoom-level" class="text-xs font-semibold px-1 min-w-[36px] text-center text-slate-700">100%</span>
      <button type="button" onclick="zoomIn()" class="p-2 hover:bg-slate-100 rounded text-slate-600"><i data-lucide="plus" class="w-4 h-4"></i></button>
      <div class="h-4 w-px bg-slate-200 mx-0.5"></div>
      <button type="button" onclick="resetView()" class="p-2 hover:bg-slate-100 rounded text-slate-600" title="Reset Tampilan"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
    </div>
  </main>

  <!-- AUTH MODAL (PASSCODE: 1111) -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-xl shadow-2xl border border-slate-100 p-5 w-full max-w-xs transform transition-all">
      <div class="text-center mb-4">
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2">
          <i data-lucide="key-round" class="w-5 h-5"></i>
        </div>
        <h3 class="text-base font-bold text-slate-900">Akses Mode Edit</h3>
        <p class="text-xs text-slate-500 mt-1">Masukkan kode 4-digit untuk mulai mengetik.</p>
      </div>

      <div class="space-y-3">
        <div>
          <input type="password" id="passcode-input" maxlength="10" placeholder="••••" class="w-full px-3 py-2 text-center text-xl tracking-widest font-mono border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <p id="auth-error" class="text-xs text-rose-500 text-center mt-1 hidden">Kode salah! Coba ketik 1111</p>
        </div>

        <div class="flex space-x-2">
          <button type="button" onclick="closeAuthModal()" class="w-1/2 py-2 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50">
            Batal
          </button>
          <button type="button" onclick="verifyPasscodeDirectly()" class="w-1/2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium shadow-sm">
            Masuk
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    lucide.createIcons();

    // Firebase Init
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForRealtimeDocumentApp",
      authDomain: "workspace-collaboration.firebaseapp.com",
      projectId: "workspace-collaboration",
      storageBucket: "workspace-collaboration.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    let isCloudConnected = false;
    let docRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      docRef = db.collection('documents').doc('shared_document_1111');
      isCloudConnected = true;
    } catch (e) {
      console.warn("Firebase fallback setup:", e);
    }

    const SECRET_CODE = "1111";
    let isEditMode = false;
    let isLocalUpdating = false;

    const docTitle = document.getElementById('doc-title');
    const docEditor = document.getElementById('doc-editor');
    const syncStatus = document.getElementById('sync-status');
    const modeBadge = document.getElementById('mode-badge');
    const btnAuthText = document.getElementById('btn-auth-text');
    const editorToolbar = document.getElementById('editor-toolbar');
    const authModal = document.getElementById('auth-modal');
    const passInput = document.getElementById('passcode-input');
    const authError = document.getElementById('auth-error');

    if (isCloudConnected && docRef) {
      docRef.onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (!isLocalUpdating) {
            if (data.title !== undefined && docTitle.innerText !== data.title) {
              docTitle.innerText = data.title;
            }
            if (data.content !== undefined && docEditor.innerHTML !== data.content) {
              docEditor.innerHTML = data.content;
            }
          }
          updateSyncStatus('Live Sync', 'emerald');
        } else {
          saveToCloud("Dokumen Bersama", "<p>Masukkan kode <b>1111</b> untuk mulai mengedit dokumen ini bersama-sama.</p>");
        }
      }, (error) => {
        updateSyncStatus('Offline', 'amber');
      });
    } else {
      updateSyncStatus('Mode Lokal', 'amber');
    }

    function saveToCloud(title, content) {
      if (!isEditMode || !docRef) return;
      updateSyncStatus('Menyimpan...', 'amber');
      docRef.set({
        title: title,
        content: content,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true })
      .then(() => updateSyncStatus('Live Sync', 'emerald'))
      .catch(() => updateSyncStatus('Gagal Simpan', 'rose'));
    }

    function setupEditorListeners() {
      const handleInput = () => {
        if (!isEditMode) return;
        isLocalUpdating = true;
        saveToCloud(docTitle.innerText, docEditor.innerHTML);
        setTimeout(() => { isLocalUpdating = false; }, 300);
      };
      docTitle.addEventListener('input', handleInput);
      docEditor.addEventListener('input', handleInput);
    }
    setupEditorListeners();

    function updateSyncStatus(text, color) {
      let colorClass = color === 'emerald' ? 'text-emerald-600' : color === 'rose' ? 'text-rose-600' : 'text-amber-600';
      let bgClass = color === 'emerald' ? 'bg-emerald-500' : color === 'rose' ? 'bg-rose-500' : 'bg-amber-500';
      syncStatus.className = `flex items-center font-medium ${colorClass}`;
      syncStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${bgClass} mr-1 animate-pulse"></span>${text}`;
    }

    // AUTHENTICATION LOGIC (LANGSUNG KUNCI / BUKA MODAL)
    function handleAuthButtonClick() {
      if (isEditMode) {
        setEditMode(false);
      } else {
        openAuthModal();
      }
    }

    function openAuthModal() {
      authModal.classList.remove('hidden');
      passInput.value = '';
      authError.classList.add('hidden');
      setTimeout(() => passInput.focus(), 150);
    }

    function closeAuthModal() {
      authModal.classList.add('hidden');
    }

    function verifyPasscodeDirectly() {
      const enteredPass = passInput.value.trim();

      if (enteredPass === SECRET_CODE) {
        closeAuthModal();
        setEditMode(true);
      } else {
        authError.classList.remove('hidden');
      }
    }

    // BISA JUGA DENGAN MENEKAN TOMBOL ENTER PADA KEYBOARD
    passInput.addEventListener('keyup', function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        verifyPasscodeDirectly();
      }
    });

    function setEditMode(enabled) {
      isEditMode = enabled;

      if (enabled) {
        docTitle.setAttribute('contenteditable', 'true');
        docEditor.setAttribute('contenteditable', 'true');
        
        modeBadge.className = "px-2 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200 flex items-center";
        modeBadge.innerHTML = `<i data-lucide="edit-3" class="w-3 h-3 mr-1"></i> Mode Edit`;
        
        btnAuthText.innerText = "Kunci";
        editorToolbar.classList.remove('pointer-events-none', 'opacity-50');

        // Otomatis fokus ke tempat ngetik
        setTimeout(() => {
          docEditor.focus();
        }, 100);
      } else {
        docTitle.setAttribute('contenteditable', 'false');
        docEditor.setAttribute('contenteditable', 'false');
        
        modeBadge.className = "px-2 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200 flex items-center";
        modeBadge.innerHTML = `<i data-lucide="eye" class="w-3 h-3 mr-1"></i> <span class="hidden sm:inline">Mode </span>Lihat`;
        
        btnAuthText.innerText = "Kode Edit";
        editorToolbar.classList.add('pointer-events-none', 'opacity-50');
      }
      lucide.createIcons();
    }

    function execCmd(command, value = null) {
      if (!isEditMode) return;
      document.execCommand(command, false, value);
      docEditor.focus();
      saveToCloud(docTitle.innerText, docEditor.innerHTML);
    }

    function triggerImageUpload() {
      if (!isEditMode) return;
      document.getElementById('image-input').click();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const imgHtml = `<div class="my-3"><img src="${event.target.result}" class="max-w-full h-auto rounded-lg shadow-sm border border-slate-200 my-1 inline-block" alt="Gambar" /></div><p><br></p>`;
        execCmd('insertHTML', imgHtml);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // Touch & Canvas Controls
    const viewport = document.getElementById('canvas-viewport');
    const transformLayer = document.getElementById('canvas-transform');
    const zoomLevelEl = document.getElementById('zoom-level');

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0, startY = 0;

    function updateTransform() {
      transformLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomLevelEl.innerText = `${Math.round(scale * 100)}%`;
    }

    function zoomIn() {
      scale = Math.min(scale + 0.1, 2.0);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale - 0.1, 0.5);
      updateTransform();
    }

    function resetView() {
      scale = 1; panX = 0; panY = 0;
      updateTransform();
    }

    viewport.addEventListener('touchstart', (e) => {
      if (e.target === viewport || e.target === transformLayer) {
        isPanning = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (!isPanning) return;
      panX = e.touches[0].clientX - startX;
      panY = e.touches[0].clientY - startY;
      updateTransform();
    }, { passive: true });

    viewport.addEventListener('touchend', () => { isPanning = false; });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.target === viewport || e.target === transformLayer) {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });
  </script>
</body>
</html>
